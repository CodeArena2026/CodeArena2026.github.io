<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeArena 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 样式表,引入Font Awesome图标字体 -->
    <!-- root使用CSS变量定义一套完整的设计系统 -->
    <!-- 全局样式 -->
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6e8efb 0%, #a777e3 100%);
            --secondary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #42e695 0%, #3bb2b8 100%);
            --danger-gradient: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            --warning-gradient: linear-gradient(135deg, #ffd166 0%, #ffb347 100%);
            --dark-bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --light-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--light-bg);
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: var(--primary-gradient);
            color: white;
            padding: 40px 50px;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.2;
            z-index: 0;
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header h1 {
            margin: 0;
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.95;
            font-weight: 400;
            max-width: 600px;
        }

        .header-icon {
            position: absolute;
            right: 50px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 5rem;
            opacity: 0.15;
        }

        .dashboard {
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .stat-card.success {
            border-left: 5px solid #42e695;
        }

        .stat-card.danger {
            border-left: 5px solid #ff758c;
        }

        .stat-card.primary {
            border-left: 5px solid #6e8efb;
        }

        .stat-card.warning {
            border-left: 5px solid #ffd166;
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: white;
        }

        .stat-icon.success {
            background: var(--success-gradient);
        }

        .stat-icon.danger {
            background: var(--danger-gradient);
        }

        .stat-icon.primary {
            background: var(--primary-gradient);
        }

        .stat-icon.warning {
            background: var(--warning-gradient);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-change {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 10px;
        }

        .positive-change {
            background: rgba(66, 230, 149, 0.15);
            color: #0fa968;
        }

        .negative-change {
            background: rgba(255, 117, 140, 0.15);
            color: #e53e3e;
        }

        .content-area {
    display: grid;
    /* 改为 1fr 表示只有一列并占满全部空间 */
    grid-template-columns: 1fr; 
    gap: 30px;
    padding: 0 30px 30px;
}
        .main-content {
            background: var(--card-bg);
            border-radius: 18px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .content-area {
    display: grid;
    /* 改为 1fr 表示只有一列并占满全部空间 */
    grid-template-columns: 1fr; 
     }

        

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .file-controls {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 25px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .file-input-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .file-input-label {
            background: var(--primary-gradient);
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            justify-content: center;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(110, 142, 251, 0.3);
        }

        .reload-btn {
            background: var(--success-gradient);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
        }

        .reload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(66, 230, 149, 0.3);
        }

        .current-file {
            background: rgba(110, 142, 251, 0.1);
            border-radius: 12px;
            padding: 15px;
            border-left: 4px solid #6e8efb;
        }

        .file-name {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .file-size {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .table-header {
            padding: 25px 25px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .table-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .search-box {
            position: relative;
            width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: #f8fafc;
            font-size: 0.95rem;
            transition: var(--transition-smooth);
        }

        .search-box input:focus {
            outline: none;
            border-color: #6e8efb;
            box-shadow: 0 0 0 3px rgba(110, 142, 251, 0.2);
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .table-container {
            max-height: 500px;
            overflow-y: auto;
            padding: 0 25px 25px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th {
            background: #f8fafc;
            padding: 18px 15px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
            font-size: 0.95rem;
        }

        td {
            padding: 18px 15px;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition-smooth);
            font-size: 0.95rem;
        }

        tr {
            transition: var(--transition-smooth);
            cursor: pointer;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        tr.selected {
            background-color: rgba(110, 142, 251, 0.1);
            position: relative;
        }

        tr.selected::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--primary-gradient);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            gap: 6px;
        }

        .status-passed {
            background: rgba(66, 230, 149, 0.15);
            color: #0fa968;
        }

        .status-failed {
            background: rgba(255, 117, 140, 0.15);
            color: #e53e3e;
        }

        .detail-panel {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 30px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            display: none;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .detail-panel.active {
            display: block;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .detail-nav {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition-smooth);
            color: var(--text-secondary);
        }

        .nav-btn:hover {
            background: var(--primary-gradient);
            color: white;
            border-color: #6e8efb;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .detail-card {
            background: #f8fafc;
            border-radius: 14px;
            padding: 20px;
            border: 1px solid var(--border-color);
            transition: var(--transition-smooth);
        }

        .detail-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-sm);
        }

        .detail-card.full-width {
            grid-column: 1 / -1;
        }

        .detail-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-value {
            font-size: 1rem;
            color: var(--text-primary);
            font-weight: 500;
            word-break: break-word;
        }

        .code-block {
            background: #1a1a2e;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 12px;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
            font-size: 0.9rem;
            overflow-x: auto;
            border: 1px solid #2d3748;
            line-height: 1.5;
            margin-top: 10px;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(110, 142, 251, 0.2);
            border-top-color: #6e8efb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: linear-gradient(135deg, rgba(255, 117, 140, 0.1) 0%, rgba(255, 126, 179, 0.1) 100%);
            color: #e53e3e;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 30px;
            border-left: 4px solid #ff758c;
            display: flex;
            align-items: center;
            gap: 15px;
            display: none;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .json-tree {
            font-family: 'SF Mono', monospace;
            font-size: 0.9rem;
        }

        .json-key {
            color: #63b3ed;
        }

        .json-string {
            color: #68d391;
        }

        .json-number {
            color: #f6ad55;
        }

        .json-boolean {
            color: #f687b3;
        }

        .json-null {
            color: #cbd5e0;
        }

        .footer {
            padding: 25px 30px;
            border-top: 1px solid var(--border-color);
            background: #f8fafc;
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }

        /* 导航栏样式 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }
        
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .navbar-brand i {
            font-size: 1.5rem;
            color: #6e8efb;
        }
        
        .navbar-actions {
            display: flex;
            gap: 10px;
        }
        
        .nav-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        
        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(110, 142, 251, 0.3);
        }
        
        /* 过滤器区域 */
        .filter-area {
            display: flex;
            gap: 20px;
            padding: 20px 30px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .filter-label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .filter-select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: white;
            font-size: 0.9rem;
            transition: var(--transition-smooth);
        }
        
        .filter-select:focus {
            outline: none;
            border-color: #6e8efb;
            box-shadow: 0 0 0 3px rgba(110, 142, 251, 0.2);
        }
        
        .filter-search {
            margin-left: auto;
            flex: 1;
            min-width: 200px;
        }
        
        /* 图表区域 */
        .chart-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
            background: var(--light-bg);
        }
        
        .chart-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            padding: 25px;
            border: 1px solid var(--border-color);
        }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .chart-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }
        
        .chart-actions {
            display: flex;
            gap: 8px;
        }
        
        .chart-btn {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition-smooth);
        }
        
        .chart-btn:hover {
            background: var(--primary-gradient);
            color: white;
            border-color: #6e8efb;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
        }
        
        /* 表格操作按钮 */
        .table-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .record-count {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .table-btn {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition-smooth);
            color: var(--text-secondary);
        }
        
        .table-btn:hover {
            background: var(--primary-gradient);
            color: white;
            border-color: #6e8efb;
        }
        
        /* 主要按钮样式 */
        .primary-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }
        
        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(110, 142, 251, 0.3);
        }
        
        /* 响应式设计 */
        @media (max-width: 1200px) {
            .dashboard {
                grid-template-columns: 1fr 1fr;
            }
            
            .content-area {
                grid-template-columns: 1fr;
            }
            
            .chart-area {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .header-icon {
                display: none;
            }
            
            .table-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .search-box {
                width: 100%;
            }
            
            .navbar {
                flex-direction: column;
                gap: 10px;
                padding: 15px;
            }
            
            .navbar-actions {
                width: 100%;
                justify-content: center;
            }
            
            .filter-area {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                padding: 15px;
            }
            
            .filter-section {
                flex-direction: column;
                align-items: stretch;
            }
            
            .chart-container {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部导航栏 -->
        <nav class="navbar">
            <div class="navbar-brand">
                <i class="fas fa-chart-line"></i>
                <span>CodeArena 2026</span>
            </div>
        </nav>
        
        <!-- 页面头部 -->
        <div class="header">
            <div class="header-content">
                <h1>实时数据可视化与分析平台</h1>
                <p>点击表格行查看详细数据 | 支持多种筛选和导出功能</p>
            </div>
        </div>
        
        <!-- 过滤器区域 -->
        <div class="filter-area" id="filterArea">
            <div class="filter-section">
                <label for="seedFilter" class="filter-label">Seed Problem:</label>
                <select id="seedFilter" class="filter-select">
                    <option value="">全部</option>
                </select>
            </div>
            <div class="filter-section">
                <label for="attackFilter" class="filter-label">攻击模型:</label>
                <select id="attackFilter" class="filter-select">
                    <option value="">全部</option>
                </select>
            </div>
            <div class="filter-section">
                <label for="defenderFilter" class="filter-label">防御模型:</label>
                <select id="defenderFilter" class="filter-select">
                    <option value="">全部</option>
                </select>
            </div>
            <div class="filter-section">
                <label for="resultFilter" class="filter-label">结果:</label>
                <select id="resultFilter" class="filter-select">
                    <option value="">全部</option>
                    <option value="passed">通过</option>
                    <option value="failed">失败</option>
                </select>
            </div>
        </div>
        
        <!-- 仪表板统计卡片 -->
        <div class="dashboard" id="dashboard">
            <!-- 统计数据卡片将通过JavaScript动态生成 -->
        </div>
        
        <!-- 图表区域 -->
        <div class="chart-area" id="chartArea">
            <div class="chart-card">
                <div class="chart-header">
                    <h3>模型成功率对比</h3>

                </div>
           
            </div>
         <!-- 侧边栏 -->
            <div class="sidebar">
                <!-- 文件控制 -->
                <div class="file-controls">
                    <div class="file-input-wrapper">
                        <input type="file" id="fileInput" class="file-input" accept=".jsonl,.json" style="display: none;">
                        <label for="fileInput" class="file-input-label">
                            <i class="fas fa-folder-open"></i>
                            选择文件
                        </label>
                        <button class="reload-btn" id="reloadBtn" title="重新加载">
                            <i class="fas fa-redo"></i>
                        </button>
                    </div>
                    
                    <div class="current-file" id="currentFileInfo">
                        <div class="file-name">
                            <i class="fas fa-file-code"></i>
                            <span id="fileName">result.jsonl</span>
                        </div>
                        <div class="file-size" id="fileSize">正在加载...</div>
                    </div>
                </div>
                
                <!-- 详细信息面板 -->
                <div class="detail-panel" id="detailPanel">
                    <div class="detail-header">
                        <div class="detail-title">
                            <i class="fas fa-info-circle"></i>
                            详细信息
                        </div>
                        <div class="detail-nav">
                            <button class="nav-btn" id="prevBtn" title="上一条">
                                <i class="fas fa-chevron-up"></i>
                            </button>
                            <button class="nav-btn" id="nextBtn" title="下一条">
                                <i class="fas fa-chevron-down"></i>
                            </button>
                            <button class="nav-btn" id="closeBtn" title="关闭">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>

        <!-- 页脚 -->
        <div class="footer">
            <div>CodeArena 2026 v1.0</div>
            <div id="footerStats">加载数据后显示统计信息</div>
        </div>
    </div>


    <!-- 前面是页面设计，包含头部分、仪表盘部分、内容区域和页脚 -->
    <!-- 后面是javascript代码,实现数据加载、搜索、导航和键盘操作等功能 -->

    <script>     // javascript代码
        // 全局变量
        let currentData = [];
        let filteredData = [];
        let selectedIndex = -1;
        let currentFileName = 'result.jsonl';
        let fileSize = 0;

        // 页面加载时自动加载 result.jsonl
        document.addEventListener('DOMContentLoaded', function() {
            loadLocalFile('result.jsonl');
            
            // 绑定事件
            document.getElementById('fileInput').addEventListener('change', handleFileSelect);
            document.getElementById('reloadBtn').addEventListener('click', () => loadLocalFile(currentFileName));
            document.getElementById('prevBtn').addEventListener('click', showPreviousDetail);
            document.getElementById('nextBtn').addEventListener('click', showNextDetail);
            document.getElementById('closeBtn').addEventListener('click', closeDetailPanel);
            document.getElementById('loadFileBtn').addEventListener('click', () => document.getElementById('fileInput').click());
            
            // 过滤器事件
            document.getElementById('seedFilter').addEventListener('change', applyFilters);
            document.getElementById('attackFilter').addEventListener('change', applyFilters);
            document.getElementById('defenderFilter').addEventListener('change', applyFilters);
            document.getElementById('resultFilter').addEventListener('change', applyFilters);
            
            // 图表类型切换事件
            document.querySelectorAll('.chart-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const chartType = this.getAttribute('data-type');
                    const chartId = this.getAttribute('data-chart');
                    updateChartType(chartId, chartType);
                });
            });
            
            // 键盘导航
            document.addEventListener('keydown', handleKeyboardNavigation);
        });

        // 加载本地jsonl文件
        async function loadLocalFile(filename) {
            showLoading(true);
            hideError();
            hideEmptyState();
            hideTable();
            
            currentFileName = filename;
            updateFileInfo();
            
            try {
                const response = await fetch(filename);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const content = await response.text();
                fileSize = new Blob([content]).size;
                parseJSONL(content);
                
            } catch (error) {
                showError(`加载 ${filename} 失败: ${error.message}`);
                showEmptyState();
                showLoading(false);
            }
        }

        // 处理用户选择的文件
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            showLoading(true);
            hideError();
            hideEmptyState();
            hideTable();
            
            currentFileName = file.name;
            fileSize = file.size;
            updateFileInfo();
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    parseJSONL(content);
                } catch (error) {
                    showError('文件读取失败: ' + error.message);
                    showEmptyState();
                    showLoading(false);
                }
            };
            reader.onerror = function() {
                showError('文件读取失败');
                showEmptyState();
                showLoading(false);
            };
            reader.readAsText(file);
        }

        // 字符串归一化函数
        function normStr(x) {
            return (x ?? '').toString().trim();
        }
        
        // 用于分桶/比较的 key 归一化函数
        function normKey(x) {
            return normStr(x).toLowerCase();
        }
        
        // 净化 JSON 字符串，替换 Infinity/NaN 为 null
        function sanitizeJsonLine(line) {
            let out = '';
            let i = 0;
            let inStr = false;
            let esc = false;

            while (i < line.length) {
                const ch = line[i];

                if (inStr) {
                    out += ch;
                    if (esc) {
                        esc = false;
                    } else if (ch === '\\') {
                        esc = true;
                    } else if (ch === '"') {
                        inStr = false;
                    }
                    i++;
                    continue;
                }

                if (ch === '"') {
                    inStr = true;
                    out += ch;
                    i++;
                    continue;
                }

                if (line.startsWith('Infinity', i) && isTokenBoundary(line, i, i + 8)) {
                    out += 'null';
                    i += 8;
                    continue;
                }
                if (line.startsWith('NaN', i) && isTokenBoundary(line, i, i + 3)) {
                    out += 'null';
                    i += 3;
                    continue;
                }

                out += ch;
                i++;
            }

            return out;
        }

        function isTokenBoundary(s, start, end) {
            const left = start - 1 >= 0 ? s[start - 1] : '';
            const right = end < s.length ? s[end] : '';
            const isWord = c => /[A-Za-z0-9_]/.test(c);
            return (!left || !isWord(left)) && (!right || !isWord(right));
        }
        
        // 归一化数据
        function normalizeData(data, id) {
            data._id = id;
            
            data.basic = normStr(data.basic);
            data.constrain_pro = normStr(data.constrain_pro);
            data.attack = normStr(data.attack);
            data.defender = normStr(data.defender);

            data._basicKey = normKey(data.basic || data.constrain_pro);
            data._attackKey = normKey(data.attack);
            data._defenderKey = normKey(data.defender);
            
            return data;
        }
        
        // 解析 JSONL 数据
        function parseJSONL(content) {
            try {
                const lines = content.trim().split('\n');
                const totalLines = lines.length;
                currentData = [];
                let fixed = 0, dropped = 0;
                
                for (let i = 0; i < lines.length; i++) {
                    const raw = lines[i].trim();
                    if (!raw) continue;
                    
                    try {
                        const data = JSON.parse(raw);
              
                        const normalizedData = normalizeData(data, i + 1);
                        currentData.push(normalizedData);
                        continue;
                    } catch (e1) {
                        //净化 Infinity/NaN
                        try {
                            const cleaned = sanitizeJsonLine(raw);
                            const data = JSON.parse(cleaned);
                            data._sanitized = true;
                        
                            const normalizedData = normalizeData(data, i + 1);
                            currentData.push(normalizedData);
                            fixed++;
                        } catch (e2) {
                            console.warn(`第 ${i + 1} 行解析失败(净化后仍失败):`, e2);
                            dropped++;
                        }
                    }
                }
                
                const parsedLines = currentData.length;
                const droppedLines = totalLines - parsedLines;
                
                console.log('数据校验/对账:');
                console.log('总行数:', totalLines);
                console.log('解析成功行数:', parsedLines);
                console.log('净化修复行数:', fixed);
                console.log('丢弃行数:', dropped);
                
                // 按 basicKey 和 attackKey 分组统计
                const groupCount = {};
                currentData.forEach(d => {
                    const key = `${d._basicKey}|${d._attackKey}`;
                    groupCount[key] = (groupCount[key] || 0) + 1;
                });
                
                console.log('分组统计（前 50 条）:');
                console.table(Object.entries(groupCount).slice(0, 50));
                
                if (currentData.length === 0) {
                    throw new Error('没有有效的 JSON 数据');
                }
                
                filteredData = [...currentData];
                
                // 更新过滤器选项
                updateFilters();
                
                renderDashboard();
                renderTable();
                
                // 渲染图表
                renderCharts();
                
                updateFileInfo();
                showLoading(false);
                hideEmptyState();
                showTable();
                
                // 默认显示第一条数据的详情
                if (currentData.length > 0) {
                    showDetail(0);
                }
                
            } catch (error) {
                showError('数据解析失败: ' + error.message);
                showEmptyState();
                showLoading(false);
            }
        }

        // 渲染仪表板统计卡片
        function renderDashboard() {
            const dashboard = document.getElementById('dashboard');
            
            // 计算统计数据
            const total = filteredData.length;
            const passed = filteredData.filter(d => isPassed(d.PK_res ?? d.result_exec)).length;
            const failed = total - passed;
            const successRate = total > 0 ? ((passed / total) * 100).toFixed(1) : 0;
            
            // 计算模型数量
            const attackModels = [...new Set(filteredData.map(d => d.attack).filter(Boolean))];
            const defenseModels = [...new Set(filteredData.map(d => d.defender).filter(Boolean))];
            
            dashboard.innerHTML = `
                <div class="stat-card success">
                    <div class="stat-icon success">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-value">${passed}</div>
                    <div class="stat-label">通过测试</div>
                    <div class="stat-change positive-change">成功率 ${successRate}%</div>
                </div>
                
                <div class="stat-card danger">
                    <div class="stat-icon danger">
                        <i class="fas fa-times-circle"></i>
                    </div>
                    <div class="stat-value">${failed}</div>
                    <div class="stat-label">失败测试</div>
                    <div class="stat-change negative-change">失败率 ${(100 - successRate).toFixed(1)}%</div>
                </div>
                
                <div class="stat-card primary">
                    <div class="stat-icon primary">
                        <i class="fas fa-robot"></i>
                    </div>
                    <div class="stat-value">${attackModels.length}</div>
                    <div class="stat-label">攻击模型</div>
                    <div class="stat-change">${attackModels.join(', ')}</div>
                </div>
                
                <div class="stat-card warning">
                    <div class="stat-icon warning">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <div class="stat-value">${defenseModels.length}</div>
                    <div class="stat-label">防御模型</div>
                    <div class="stat-change">${defenseModels.join(', ')}</div>
                </div>
            `;
        }

        // 渲染表格
        function renderTable() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            
            filteredData.forEach((data, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${data._id}</td>
                    <td>${data.basic || data.constrain_pro || '-'}</td>
                    <td><strong>${data.attack || '-'}</strong></td>
                    <td>${data.defender || '-'}</td>
                    <td><span class="badge">${data.epoch || '-'}</span></td>
                    <td>${getStatusBadge(data.PK_res || data.result_exec)}</td>
                    <td><code>${truncateText(data.sgn || '-', 40)}</code></td>
                `;
                
                row.addEventListener('click', () => showDetail(index));
                tableBody.appendChild(row);
            });
            
            document.getElementById('recordCount').textContent = `${filteredData.length} 条记录`;
            updateFooterStats();
        }

        // 检查是否通过
        function isPassed(result) {
            if (result === undefined || result === null) return false;
            return (typeof result === 'string' && result.includes('Passed')) || 
                   result === true || 
                   result === 'true' ||
                   (typeof result === 'string' && result.toLowerCase() === 'passed');
        }

        // 获取状态徽章
        function getStatusBadge(result) {
            if (result === undefined || result === null) return '-';
            
            const passed = isPassed(result);
            return `<span class="status-badge ${passed ? 'status-passed' : 'status-failed'}">
                <i class="fas ${passed ? 'fa-check' : 'fa-times'}"></i>
                ${passed ? '通过' : '失败'}
            </span>`;
        }
        function formatJsonList(value) {
    if (!value || value === '[]' || value === '{}') return value;

    // 1. 将数据拆分为独立项，支持 ", " 或 "," 分隔
    // 2. 使用正则表达式：匹配每一个“结束符号” (] 或 }) 后面的逗号
    // 3. 将其替换为“原符号 + <br><br>”
    return value.replace(/([\]}])\s*,\s*/g, '$1<br><br>');
}

        // 显示详细信息
        function showDetail(index) {
            if (filteredData.length === 0 || index < 0 || index >= filteredData.length) return;
            
            selectedIndex = index;
            const data = filteredData[index];
            
            // 更新选中行样式
            document.querySelectorAll('#tableBody tr').forEach((tr, i) => {
                tr.classList.toggle('selected', i === index);
            });
            
            // 更新导航按钮状态
            updateNavButtons();
        
            
            // 生成详细信息
            const detailContent = document.getElementById('detailContent');
            detailContent.innerHTML = `
                <div class="detail-card">
                    <div class="detail-label">
                        <i class="fas fa-puzzle-piece"></i> Seed Problem
                    </div>
                    <div class="detail-value">${data.basic || '-'}</div>
                </div>
                
                <div class="detail-card">
                    <div class="detail-label">
                        <i class="fas fa-cogs"></i> 约束问题
                    </div>
                    <div class="detail-value">${data.constrain_pro || '-'}</div>
                </div>
                
                <div class="detail-card">
                    <div class="detail-label">
                        <i class="fas fa-robot"></i> 攻击模型
                    </div>
                    <div class="detail-value">${data.attack || '-'}</div>
                </div>
                
                <div class="detail-card">
                    <div class="detail-label">
                        <i class="fas fa-shield-alt"></i> 防御模型
                    </div>
                    <div class="detail-value">${data.defender || '-'}</div>
                </div>
                
                <div class="detail-card">
                    <div class="detail-label">
                        <i class="fas fa-check-circle"></i> PK 结果
                    </div>
                    <div class="detail-value">${getStatusBadge(data.PK_res || data.result_exec)}</div>
                </div>
                
                <div class="detail-card">
                    <div class="detail-label">
                        <i class="fas fa-play-circle"></i> 执行结果
                    </div>
                    <div class="detail-value">${formatValue(data.result_exec)}</div>
                </div>
                
                <div class="detail-card">
                    <div class="detail-label">
                        <i class="fas fa-code"></i> 函数签名
                    </div>
                    <div class="detail-value"><code>${data.sgn || '-'}</code></div>
                </div>
                
                <div class="detail-card">
                    <div class="detail-label">
                        <i class="fas fa-keyboard"></i> 测试输入
                    </div>
                   <div class="detail-value">${formatJsonList(data.test_input)}</div>
                </div>
                
                <div class="detail-card">
                    <div class="detail-label">
                        <i class="fas fa-chart-bar"></i> 测试结果
                    </div>
                   <div class="detail-value">${formatJsonList(data.result)}</div>
                </div>
                
                <div class="detail-card full-width">
                    <div class="detail-label">
                        <i class="fas fa-code"></i> 原始代码
                    </div>
                    <pre class="code-block">${escapeHtml(data.code || '暂无代码')}</pre>
                </div>
                
                <div class="detail-card full-width">
                    <div class="detail-label">
                        <i class="fas fa-comment-alt"></i> 提示信息
                    </div>
                    <pre class="code-block">${escapeHtml(data.prompt || '暂无提示信息')}</pre>
                </div>
                
                <div class="detail-card full-width">
                    <div class="detail-label">
                        <i class="fas fa-terminal"></i> 完成内容
                    </div>
                    <pre class="code-block">${escapeHtml(data.completion || '暂无完成内容')}</pre>
                </div>
            `;
            
            // 显示详情面板
            document.getElementById('detailPanel').classList.add('active');
        }

        // 显示上一条详情
        function showPreviousDetail() {
            if (selectedIndex > 0) {
                showDetail(selectedIndex - 1);
            } else if (filteredData.length > 0) {
                showDetail(filteredData.length - 1); // 循环到最后一条
            }
        }

        // 显示下一条详情
        function showNextDetail() {
            if (selectedIndex < filteredData.length - 1) {
                showDetail(selectedIndex + 1);
            } else if (filteredData.length > 0) {
                showDetail(0); // 循环到第一条
            }
        }

        // 关闭详情面板
        function closeDetailPanel() {
            document.getElementById('detailPanel').classList.remove('active');
            document.querySelectorAll('#tableBody tr').forEach(tr => tr.classList.remove('selected'));
            selectedIndex = -1;
        }

        // 更新导航按钮状态
        function updateNavButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = filteredData.length === 0 || selectedIndex <= 0;
            nextBtn.disabled = filteredData.length === 0 || selectedIndex >= filteredData.length - 1;
            
            if (prevBtn.disabled) {
                prevBtn.style.opacity = '0.5';
                prevBtn.style.cursor = 'not-allowed';
            } else {
                prevBtn.style.opacity = '1';
                prevBtn.style.cursor = 'pointer';
            }
            
            if (nextBtn.disabled) {
                nextBtn.style.opacity = '0.5';
                nextBtn.style.cursor = 'not-allowed';
            } else {
                nextBtn.style.opacity = '1';
                nextBtn.style.cursor = 'pointer';
            }
        }

        // 处理键盘导航
        function handleKeyboardNavigation(event) {
            if (filteredData.length === 0) return;
            
            switch(event.key) {
                case 'ArrowUp':
                    event.preventDefault();
                    if (selectedIndex > 0) {
                        showDetail(selectedIndex - 1);
                    }
                    break;
                case 'ArrowDown':
                    event.preventDefault();
                    if (selectedIndex < filteredData.length - 1) {
                        showDetail(selectedIndex + 1);
                    }
                    break;
                case 'Escape':
                    closeDetailPanel();
                    break;
            }
        }

        // 更新文件信息
        function updateFileInfo() {
            document.getElementById('fileName').textContent = currentFileName;
            
            if (fileSize > 0) {
                const sizeText = formatFileSize(fileSize);
                document.getElementById('fileSize').textContent = `${sizeText} | ${currentData.length} 条记录`;
            } else {
                document.getElementById('fileSize').textContent = `${currentData.length} 条记录`;
            }
        }

        // 更新页脚统计信息
        function updateFooterStats() {
            const total = filteredData.length;
            const passed = filteredData.filter(d => isPassed(d.PK_res ?? d.result_exec)).length;
            const successRate = total > 0 ? ((passed / total) * 100).toFixed(1) : 0;
            
            document.getElementById('footerStats').textContent = 
                `显示 ${total} 条记录 | 通过: ${passed} | 失败: ${total - passed} | 成功率: ${successRate}%`;
        }

        // 应用过滤器
        function applyFilters() {
            const seedFilter = document.getElementById('seedFilter').value;
            const attackFilter = document.getElementById('attackFilter').value;
            const defenderFilter = document.getElementById('defenderFilter').value;
            const resultFilter = document.getElementById('resultFilter').value;
            
            filteredData = currentData.filter(data => {
                const seedMatch = !seedFilter || data._basicKey === normKey(seedFilter);
                const attackMatch = !attackFilter || data._attackKey === normKey(attackFilter);
                const defenderMatch = !defenderFilter || data._defenderKey === normKey(defenderFilter);
                
                let resultMatch = true;
                if (resultFilter) {
                    const passed = isPassed(data.PK_res ?? data.result_exec);
                    resultMatch = (resultFilter === 'passed' && passed) || (resultFilter === 'failed' && !passed);
                }
                
                return seedMatch && attackMatch && defenderMatch && resultMatch;
            });
            
            renderDashboard();
            renderTable();
            renderCharts();
            
            // 如果有筛选结果，显示第一个详情
            if (filteredData.length > 0) {
                showDetail(0);
            } else {
                closeDetailPanel();
            }
        }
        
        // 更新过滤器选项
        function updateFilters() {
            // 提取所有唯一值
            const seedProblems = [...new Set(currentData.map(d => d.basic).filter(Boolean))];
            const attackModels = [...new Set(currentData.map(d => d.attack).filter(Boolean))];
            const defenderModels = [...new Set(currentData.map(d => d.defender).filter(Boolean))];
            
            // 更新 Seed Problem 过滤器
            const seedFilter = document.getElementById('seedFilter');
            seedFilter.innerHTML = '<option value="">全部</option>';
            seedProblems.forEach(seed => {
                const option = document.createElement('option');
                option.value = seed;
                option.textContent = seed;
                seedFilter.appendChild(option);
            });
            
            // 更新攻击模型过滤器
            const attackFilter = document.getElementById('attackFilter');
            attackFilter.innerHTML = '<option value="">全部</option>';
            attackModels.forEach(model => {
                const option = document.createElement('option');
                option.value = model;
                option.textContent = model;
                attackFilter.appendChild(option);
            });
            
            // 更新防御模型过滤器
            const defenderFilter = document.getElementById('defenderFilter');
            defenderFilter.innerHTML = '<option value="">全部</option>';
            defenderModels.forEach(model => {
                const option = document.createElement('option');
                option.value = model;
                option.textContent = model;
                defenderFilter.appendChild(option);
            });
        }
        
        // 图表实例
        let charts = {};
        
        // 渲染图表
        function renderCharts() {
            renderSuccessRateChart();
            renderSeedDistributionChart();
        }
        
        // 渲染成功率对比图表
        function renderSuccessRateChart() {
            const ctx = document.getElementById('successRateChart').getContext('2d');
            
            // 准备数据
                const models = [...new Set(filteredData.map(d => d.defender).filter(Boolean))];
                const data = models.map(model => {
                    const modelData = filteredData.filter(d => d.defender === model);
                    const passed = modelData.filter(d => isPassed(d.PK_res ?? d.result_exec)).length;
                    const total = modelData.length;
                    const successRate = total > 0 ? (passed / total) * 100 : 0;
                    return {
                        model: model,
                    successRate: successRate,
                    passed: passed,
                    total: total
                };
            });
            
            // 销毁旧图表
            if (charts.successRate) {
                charts.successRate.destroy();
            }
            
            // 创建新图表
            charts.successRate = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(item => item.model),
                    datasets: [{
                        label: '成功率 (%)',
                        data: data.map(item => item.successRate),
                        backgroundColor: 'rgba(110, 142, 251, 0.8)',
                        borderColor: 'rgba(110, 142, 251, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    tainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            title: {
                                display: true,
                                text: '成功率 (%)'
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                afterLabel: function(context) {
                                    const item = data[context.dataIndex];
                                    return `通过: ${item.passed} / ${item.total}`;
                                }
                            }
                        }
                    }
                }
            });
        }
        
        // 渲染 Seed Problem 分布图表
        function renderSeedDistributionChart() {
            const ctx = document.getElementById('seedDistributionChart').getContext('2d');
            
            // 准备数据
            const seedCounts = {};
            filteredData.forEach(data => {
                const seed = data.basic || data.constrain_pro;
                if (seed) {
                    seedCounts[seed] = (seedCounts[seed] || 0) + 1;
                }
            });
            
            const labels = Object.keys(seedCounts);
            const values = Object.values(seedCounts);
            
            // 销毁旧图表
            if (charts.seedDistribution) {
                charts.seedDistribution.destroy();
            }
            
            // 创建新图表
            charts.seedDistribution = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: [
                            'rgba(110, 142, 251, 0.8)',
                            'rgba(66, 230, 149, 0.8)',
                            'rgba(255, 117, 140, 0.8)',
                            'rgba(255, 209, 102, 0.8)',
                            'rgba(79, 172, 254, 0.8)',
                            'rgba(122, 103, 238, 0.8)'
                        ],
                        borderColor: [
                            'rgba(110, 142, 251, 1)',
                            'rgba(66, 230, 149, 1)',
                            'rgba(255, 117, 140, 1)',
                            'rgba(255, 209, 102, 1)',
                            'rgba(79, 172, 254, 1)',
                            'rgba(122, 103, 238, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right'
                        }
                    }
                }
            });
        }
        
        // 更新图表类型
        function updateChartType(chartId, type) {
            if (chartId === 'successRate') {
                const ctx = document.getElementById('successRateChart').getContext('2d');
                if (charts.successRate) {
                    charts.successRate.destroy();
                }
                
                // 准备数据
                const models = [...new Set(filteredData.map(d => d.defender).filter(Boolean))];
                const data = models.map(model => {
                    const modelData = filteredData.filter(d => d.defender === model);
                    const passed = modelData.filter(d => isPassed(d.PK_res ?? d.result_exec)).length;
                    const total = modelData.length;
                    const successRate = total > 0 ? (passed / total) * 100 : 0;
                    return {
                        model: model,
                        successRate: successRate,
                        passed: passed,
                        total: total
                    };
                });
                
                charts.successRate = new Chart(ctx, {
                    type: type,
                    data: {
                        labels: data.map(item => item.model),
                        datasets: [{
                            label: '成功率 (%)',
                            data: data.map(item => item.successRate),
                            backgroundColor: type === 'pie' ? [
                                'rgba(110, 142, 251, 0.8)',
                                'rgba(66, 230, 149, 0.8)',
                                'rgba(255, 117, 140, 0.8)',
                                'rgba(255, 209, 102, 0.8)',
                                'rgba(79, 172, 254, 0.8)'
                            ] : 'rgba(110, 142, 251, 0.8)',
                            borderColor: type === 'pie' ? [
                                'rgba(110, 142, 251, 1)',
                                'rgba(66, 230, 149, 1)',
                                'rgba(255, 117, 140, 1)',
                                'rgba(255, 209, 102, 1)',
                                'rgba(79, 172, 254, 1)'
                            ] : 'rgba(110, 142, 251, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: type === 'pie'
                            }
                        }
                    }
                });
            } else if (chartId === 'seedDistribution') {
                const ctx = document.getElementById('seedDistributionChart').getContext('2d');
                if (charts.seedDistribution) {
                    charts.seedDistribution.destroy();
                }
                
                // 准备数据
                const seedCounts = {};
                filteredData.forEach(data => {
                    const seed = data.basic || data.constrain_pro;
                    if (seed) {
                        seedCounts[seed] = (seedCounts[seed] || 0) + 1;
                    }
                });
                
                const labels = Object.keys(seedCounts);
                const values = Object.values(seedCounts);
                
                charts.seedDistribution = new Chart(ctx, {
                    type: type,
                    data: {
                        labels: labels,
                        datasets: [{
                            data: values,
                            backgroundColor: [
                                'rgba(110, 142, 251, 0.8)',
                                'rgba(66, 230, 149, 0.8)',
                                'rgba(255, 117, 140, 0.8)',
                                'rgba(255, 209, 102, 0.8)',
                                'rgba(79, 172, 254, 0.8)',
                                'rgba(122, 103, 238, 0.8)'
                            ],
                            borderColor: [
                                'rgba(110, 142, 251, 1)',
                                'rgba(66, 230, 149, 1)',
                                'rgba(255, 117, 140, 1)',
                                'rgba(255, 209, 102, 1)',
                                'rgba(79, 172, 254, 1)',
                                'rgba(122, 103, 238, 1)'
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'right'
                            }
                        }
                    }
                });
            }
        }
        
        // 辅助函数
        function formatValue(value) {
            if (value === undefined || value === null) return '未设置';
            if (Array.isArray(value)) {
                return value.map(v => JSON.stringify(v)).join(', ');
            }
            if (typeof value === 'object') {
                return JSON.stringify(value, null, 2);
            }
            return String(value);
        }

        function escapeHtml(text) {
            if (text === undefined || text === null) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function truncateText(text, maxLength) {
            if (!text) return '-';
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength) + '...';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // UI 控制函数
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        function showError(message) {
            const error = document.getElementById('error');
            document.getElementById('errorMessage').textContent = message;
            error.style.display = 'flex';
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        function showEmptyState() {
            document.getElementById('emptyState').style.display = 'block';
        }

        function hideEmptyState() {
            document.getElementById('emptyState').style.display = 'none';
        }

        function showTable() {
            document.getElementById('tableContainer').style.display = 'block';
        }

        function hideTable() {
            document.getElementById('tableContainer').style.display = 'none';
        }
    </script>
</body>
