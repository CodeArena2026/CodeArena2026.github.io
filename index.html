<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeArena 2026 - 多文件分析</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 样式与原页面完全相同，省略重复部分（实际使用时请保留完整样式） */
        :root {
            --primary-gradient: linear-gradient(135deg, #6e8efb 0%, #a777e3 100%);
            --secondary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #42e695 0%, #3bb2b8 100%);
            --danger-gradient: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            --warning-gradient: linear-gradient(135deg, #ffd166 0%, #ffb347 100%);
            --dark-bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --light-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--dark-bg); color: var(--text-primary); min-height: 100vh; padding: 20px; line-height: 1.6; }
        .container { max-width: 1400px; margin: 0 auto; background: var(--light-bg); border-radius: 20px; box-shadow: var(--shadow-lg); overflow: hidden; animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .header { background: var(--primary-gradient); color: white; padding: 40px 50px; position: relative; overflow: hidden; }
        .header::before { content: ''; position: absolute; top: -50%; right: -50%; width: 100%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 30px 30px; opacity: 0.2; z-index: 0; }
        .header-content { position: relative; z-index: 1; }
        .header h1 { margin: 0; font-size: 2.8rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; }
        .header p { font-size: 1.2rem; opacity: 0.95; font-weight: 400; max-width: 600px; }
        .header-icon { position: absolute; right: 50px; top: 50%; transform: translateY(-50%); font-size: 5rem; opacity: 0.15; }
        .dashboard { padding: 30px; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 25px; }
        .stat-card { background: var(--card-bg); border-radius: 16px; padding: 25px; box-shadow: var(--shadow-sm); transition: var(--transition-smooth); position: relative; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.2); }
        .stat-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }
        .stat-card.success { border-left: 5px solid #42e695; }
        .stat-card.danger { border-left: 5px solid #ff758c; }
        .stat-card.primary { border-left: 5px solid #6e8efb; }
        .stat-card.warning { border-left: 5px solid #ffd166; }
        .stat-icon { width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 20px; color: white; }
        .stat-icon.success { background: var(--success-gradient); }
        .stat-icon.danger { background: var(--danger-gradient); }
        .stat-icon.primary { background: var(--primary-gradient); }
        .stat-icon.warning { background: var(--warning-gradient); }
        .stat-value { font-size: 2.5rem; font-weight: 800; line-height: 1; margin-bottom: 5px; }
        .stat-label { font-size: 1rem; color: var(--text-secondary); font-weight: 500; }
        .stat-change { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-top: 10px; }
        .positive-change { background: rgba(66, 230, 149, 0.15); color: #0fa968; }
        .negative-change { background: rgba(255, 117, 140, 0.15); color: #e53e3e; }
        .content-area { display: grid; grid-template-columns: 1fr; gap: 30px; padding: 0 30px 30px; }
        .main-content { background: var(--card-bg); border-radius: 18px; box-shadow: var(--shadow-md); overflow: hidden; border: 1px solid var(--border-color); }
        .sidebar { display: flex; flex-direction: column; gap: 30px; }
        .file-controls { background: var(--card-bg); border-radius: 18px; padding: 25px; box-shadow: var(--shadow-md); border: 1px solid var(--border-color); }
        .file-input-wrapper { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .file-input-label { background: var(--primary-gradient); color: white; padding: 14px 28px; border-radius: 12px; cursor: pointer; transition: var(--transition-smooth); font-weight: 600; display: flex; align-items: center; gap: 10px; flex: 1; justify-content: center; }
        .file-input-label:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(110, 142, 251, 0.3); }
        .reload-btn { background: var(--success-gradient); color: white; border: none; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: 600; transition: var(--transition-smooth); display: flex; align-items: center; justify-content: center; width: 60px; }
        .reload-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(66, 230, 149, 0.3); }
        .current-file { background: rgba(110, 142, 251, 0.1); border-radius: 12px; padding: 15px; border-left: 4px solid #6e8efb; }
        .file-name { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-bottom: 5px; }
        .file-size { font-size: 0.9rem; color: var(--text-secondary); }
        .table-header { padding: 25px 25px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .table-header h2 { font-size: 1.5rem; font-weight: 700; }
        .search-box { position: relative; width: 300px; }
        .search-box input { width: 100%; padding: 12px 20px 12px 45px; border-radius: 12px; border: 1px solid var(--border-color); background: #f8fafc; font-size: 0.95rem; transition: var(--transition-smooth); }
        .search-box input:focus { outline: none; border-color: #6e8efb; box-shadow: 0 0 0 3px rgba(110, 142, 251, 0.2); }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
        .table-container { max-height: 500px; overflow-y: auto; padding: 0 25px 25px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; }
        th { background: #f8fafc; padding: 18px 15px; text-align: left; font-weight: 600; color: var(--text-primary); border-bottom: 2px solid var(--border-color); position: sticky; top: 0; z-index: 10; font-size: 0.95rem; }
        td { padding: 18px 15px; border-bottom: 1px solid var(--border-color); transition: var(--transition-smooth); font-size: 0.95rem; }
        tr { transition: var(--transition-smooth); cursor: pointer; }
        tr:hover { background-color: #f8fafc; }
        tr.selected { background-color: rgba(110, 142, 251, 0.1); position: relative; }
        tr.selected::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 4px; background: var(--primary-gradient); }
        .status-badge { display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; gap: 6px; }
        .status-passed { background: rgba(66, 230, 149, 0.15); color: #0fa968; }
        .status-failed { background: rgba(255, 117, 140, 0.15); color: #e53e3e; }
        .detail-panel { background: var(--card-bg); border-radius: 18px; padding: 30px; box-shadow: var(--shadow-md); border: 1px solid var(--border-color); display: none; animation: slideUp 0.4s ease-out; }
        .detail-panel.active { display: block; }
        .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .detail-title { font-size: 1.5rem; font-weight: 700; }
        .detail-nav { display: flex; gap: 10px; }
        .nav-btn { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #f8fafc; border: 1px solid var(--border-color); cursor: pointer; transition: var(--transition-smooth); color: var(--text-secondary); }
        .nav-btn:hover { background: var(--primary-gradient); color: white; border-color: #6e8efb; }
        .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .detail-card { background: #f8fafc; border-radius: 14px; padding: 20px; border: 1px solid var(--border-color); transition: var(--transition-smooth); }
        .detail-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-sm); }
        .detail-card.full-width { grid-column: 1 / -1; }
        .detail-label { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
        .detail-value { white-space: pre-wrap; word-break: break-all; font-family: 'Consolas', 'Monaco', monospace; font-size: 14px; line-height: 1.5; color: #d63384; }
        .code-block { background: #1a1a2e; color: #e2e8f0; padding: 20px; border-radius: 12px; font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace; font-size: 0.9rem; overflow-x: auto; border: 1px solid #2d3748; line-height: 1.5; margin-top: 10px; }
        .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--text-secondary); }
        .spinner { width: 60px; height: 60px; border: 4px solid rgba(110, 142, 251, 0.2); border-top-color: #6e8efb; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { background: linear-gradient(135deg, rgba(255, 117, 140, 0.1) 0%, rgba(255, 126, 179, 0.1) 100%); color: #e53e3e; padding: 20px; border-radius: 12px; margin: 20px 30px; border-left: 4px solid #ff758c; display: flex; align-items: center; gap: 15px; display: none; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-icon { font-size: 4rem; margin-bottom: 20px; opacity: 0.3; }
        .footer { padding: 25px 30px; border-top: 1px solid var(--border-color); background: #f8fafc; color: var(--text-secondary); font-size: 0.9rem; display: flex; justify-content: space-between; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
        .navbar-brand { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 700; color: var(--text-primary); }
        .navbar-brand i { font-size: 1.5rem; color: #6e8efb; }
        .filter-area { display: flex; gap: 20px; padding: 20px 30px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); flex-wrap: wrap; align-items: center; }
        .filter-section { display: flex; align-items: center; gap: 8px; }
        .filter-label { font-weight: 600; color: var(--text-secondary); font-size: 0.9rem; }
        .filter-select { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 8px; background: white; font-size: 0.9rem; transition: var(--transition-smooth); }
        .filter-select:focus { outline: none; border-color: #6e8efb; box-shadow: 0 0 0 3px rgba(110, 142, 251, 0.2); }
        .chart-area { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; padding: 30px; background: var(--light-bg); }
        .chart-card { background: var(--card-bg); border-radius: 16px; box-shadow: var(--shadow-md); padding: 25px; border: 1px solid var(--border-color); }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .chart-header h3 { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); margin: 0; }
        .chart-actions { display: flex; gap: 8px; }
        .chart-btn { padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 6px; background: white; cursor: pointer; font-size: 0.8rem; transition: var(--transition-smooth); }
        .chart-btn:hover { background: var(--primary-gradient); color: white; border-color: #6e8efb; }
        .chart-container { position: relative; height: 300px; }
        .table-actions { display: flex; align-items: center; gap: 15px; }
        .record-count { font-size: 0.9rem; color: var(--text-secondary); font-weight: 500; }
        .primary-btn { background: var(--primary-gradient); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; transition: var(--transition-smooth); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; margin-top: 15px; }
        .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(110, 142, 251, 0.3); }
        @media (max-width: 1200px) { .dashboard { grid-template-columns: 1fr 1fr; } .content-area { grid-template-columns: 1fr; } .chart-area { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .dashboard { grid-template-columns: 1fr; } .header h1 { font-size: 2rem; } .header-icon { display: none; } .table-header { flex-direction: column; align-items: flex-start; gap: 15px; } .search-box { width: 100%; } .navbar { flex-direction: column; gap: 10px; padding: 15px; } .filter-area { flex-direction: column; align-items: stretch; gap: 10px; padding: 15px; } .filter-section { flex-direction: column; align-items: stretch; } .chart-container { height: 250px; } }
    </style>
</head>
<body>
<div class="container">
    <nav class="navbar">
        <div class="navbar-brand"><i class="fas fa-chart-line"></i><span>CodeArena 2026</span></div>
    </nav>
    <div class="header">
        <div class="header-content">
            <h1>多文件数据可视化与分析平台</h1>
            <p>选择 result 文件夹下的多个 JSONL 文件，合并分析</p>
        </div>
    </div>
    <div class="filter-area" id="filterArea">
        <div class="filter-section"><label for="seedFilter" class="filter-label">Seed Problem:</label><select id="seedFilter" class="filter-select"><option value="">全部</option></select></div>
        <div class="filter-section"><label for="attackFilter" class="filter-label">攻击模型:</label><select id="attackFilter" class="filter-select"><option value="">全部</option></select></div>
        <div class="filter-section"><label for="defenderFilter" class="filter-label">防御模型:</label><select id="defenderFilter" class="filter-select"><option value="">全部</option></select></div>
        <div class="filter-section"><label for="resultFilter" class="filter-label">结果:</label><select id="resultFilter" class="filter-select"><option value="">全部</option><option value="passed">通过</option><option value="failed">失败</option></select></div>
    </div>
    <div class="dashboard" id="dashboard"></div>
    <div class="chart-area" id="chartArea">
        <div class="chart-card"><div class="chart-header"><h3>模型成功率对比</h3><div class="chart-actions"><button class="chart-btn" data-chart="successRate" data-type="bar">柱状图</button><button class="chart-btn" data-chart="successRate" data-type="pie">饼图</button></div></div><div class="chart-container"><canvas id="successRateChart"></canvas></div></div>
        <div class="chart-card"><div class="chart-header"><h3>Seed Problem 分布</h3><div class="chart-actions"><button class="chart-btn" data-chart="seedDistribution" data-type="pie">饼图</button><button class="chart-btn" data-chart="seedDistribution" data-type="doughnut">环形图</button></div></div><div class="chart-container"><canvas id="seedDistributionChart"></canvas></div></div>
    </div>
    <div class="content-area">
        <div class="main-content">
            <div class="table-header"><h2><i class="fas fa-table"></i> 数据记录</h2><div class="table-actions"><span id="recordCount" class="record-count">0 条记录</span></div></div>
            <div id="error" class="error" style="display: none;"><i class="fas fa-exclamation-circle"></i><div id="errorMessage"></div></div>
            <div id="loading" class="loading" style="display: none;"><div class="spinner"></div><p>正在加载数据...</p></div>
            <div id="emptyState" class="empty-state" style="display: none;"><div class="empty-icon"><i class="fas fa-database"></i></div><h3>暂无数据</h3><p>请点击下方按钮选择一个或多个 JSONL 文件（支持多选）</p><button class="primary-btn" id="loadFileBtn"><i class="fas fa-folder-open"></i> 选择文件</button></div>
            <div class="table-container" id="tableContainer" style="display: none;"><table id="dataTable"><thead><tr><th>ID</th><th>Seed Problem</th><th>攻击模型</th><th>防御模型</th><th>轮次</th><th>结果</th><th>代码实际运行结果</th></tr></thead><tbody id="tableBody"></tbody></table></div>
        </div>
        <div class="sidebar">
            <div class="file-controls">
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" class="file-input" accept=".jsonl,.json" multiple style="display: none;">
                    <label for="fileInput" class="file-input-label"><i class="fas fa-folder-open"></i> 选择多个文件</label>
                    <button class="reload-btn" id="reloadBtn" title="重新加载当前所选文件"><i class="fas fa-redo"></i></button>
                </div>
                <div class="current-file" id="currentFileInfo"><div class="file-name"><i class="fas fa-file-code"></i><span id="fileName">未加载文件</span></div><div class="file-size" id="fileSize">请选择 JSONL 文件</div></div>
            </div>
            <div class="detail-panel" id="detailPanel">
                <div class="detail-header"><div class="detail-title"><i class="fas fa-info-circle"></i> 详细信息</div><div class="detail-nav"><button class="nav-btn" id="prevBtn" title="上一条"><i class="fas fa-chevron-up"></i></button><button class="nav-btn" id="nextBtn" title="下一条"><i class="fas fa-chevron-down"></i></button><button class="nav-btn" id="closeBtn" title="关闭"><i class="fas fa-times"></i></button></div></div>
                <div class="detail-grid" id="detailContent"></div>
            </div>
        </div>
    </div>
    <div class="footer"><div>CodeArena 2026 v2.0 - 多文件合并分析</div><div id="footerStats">加载数据后显示统计信息</div></div>
</div>

<script>
    // 全局变量
    let currentData = [];
    let filteredData = [];
    let selectedIndex = -1;
    let currentFiles = [];        // 存储已加载的文件名列表

    // DOM 元素绑定
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('fileInput').addEventListener('change', handleMultipleFiles);
        document.getElementById('reloadBtn').addEventListener('click', () => { if(currentFiles.length) reloadCurrentFiles(); else document.getElementById('fileInput').click(); });
        document.getElementById('prevBtn').addEventListener('click', showPreviousDetail);
        document.getElementById('nextBtn').addEventListener('click', showNextDetail);
        document.getElementById('closeBtn').addEventListener('click', closeDetailPanel);
        document.getElementById('loadFileBtn').addEventListener('click', () => document.getElementById('fileInput').click());
        document.getElementById('seedFilter').addEventListener('change', applyFilters);
        document.getElementById('attackFilter').addEventListener('change', applyFilters);
        document.getElementById('defenderFilter').addEventListener('change', applyFilters);
        document.getElementById('resultFilter').addEventListener('change', applyFilters);
        document.querySelectorAll('.chart-btn').forEach(btn => btn.addEventListener('click', function() { updateChartType(this.getAttribute('data-chart'), this.getAttribute('data-type')); }));
        document.addEventListener('keydown', handleKeyboardNavigation);
        // 初始显示空状态，等待用户选择文件
        showEmptyState();
    });

    // 处理多文件选择
    async function handleMultipleFiles(event) {
        const files = Array.from(event.target.files);
        if (!files.length) return;
        showLoading(true);
        hideError();
        hideEmptyState();
        hideTable();
        closeDetailPanel();

        let allData = [];
        let totalSize = 0;
        let fileNames = [];

        for (const file of files) {
            if (!file.name.endsWith('.jsonl') && !file.name.endsWith('.json')) continue;
            fileNames.push(file.name);
            totalSize += file.size;
            try {
                const content = await file.text();
                const parsed = parseJSONLContent(content, file.name);
                allData.push(...parsed);
            } catch (err) {
                console.error(`解析文件 ${file.name} 失败:`, err);
                showError(`文件 ${file.name} 解析失败: ${err.message}`);
            }
        }

        if (allData.length === 0) {
            showError("所选文件未包含有效 JSONL 数据");
            showEmptyState();
            showLoading(false);
            return;
        }

        currentData = allData;
        currentFiles = fileNames;
        filteredData = [...currentData];

        updateFileInfo();
        updateFilters();
        renderDashboard();
        renderTable();
        renderCharts();
        if (currentData.length > 0) showDetail(0);

        showLoading(false);
        hideEmptyState();
        showTable();
    }

    // 重新加载当前已选文件（用于 reload 按钮）
    async function reloadCurrentFiles() {
        if (!currentFiles.length) return;
        // 模拟重新选择文件，需要从用户本地再次读取，这里简单触发文件选择
        document.getElementById('fileInput').click();
    }

    // 解析单个文件内容，返回数据数组（带来源标记）
    function parseJSONLContent(content, fileName) {
        const lines = content.trim().split('\n');
        const dataList = [];
        let fixed = 0, dropped = 0;
        for (let i = 0; i < lines.length; i++) {
            const raw = lines[i].trim();
            if (!raw) continue;
            try {
                const data = JSON.parse(raw);
                dataList.push(normalizeData(data, i + 1, fileName));
                continue;
            } catch (e1) {
                try {
                    const cleaned = sanitizeJsonLine(raw);
                    const data = JSON.parse(cleaned);
                    data._sanitized = true;
                    dataList.push(normalizeData(data, i + 1, fileName));
                    fixed++;
                } catch (e2) {
                    dropped++;
                }
            }
        }
        console.log(`文件 ${fileName}: 解析成功 ${dataList.length} 条, 净化修复 ${fixed}, 丢弃 ${dropped}`);
        return dataList;
    }

    function sanitizeJsonLine(line) {
        // 与之前相同的实现
        let out = '', i = 0, inStr = false, esc = false;
        while (i < line.length) {
            const ch = line[i];
            if (inStr) {
                out += ch;
                if (esc) esc = false;
                else if (ch === '\\') esc = true;
                else if (ch === '"') inStr = false;
                i++;
                continue;
            }
            if (ch === '"') { inStr = true; out += ch; i++; continue; }
            if (line.startsWith('Infinity', i) && isTokenBoundary(line, i, i+8)) { out += 'null'; i += 8; continue; }
            if (line.startsWith('NaN', i) && isTokenBoundary(line, i, i+3)) { out += 'null'; i += 3; continue; }
            out += ch; i++;
        }
        return out;
    }
    function isTokenBoundary(s, start, end) {
        const left = start-1 >=0 ? s[start-1] : '';
        const right = end < s.length ? s[end] : '';
        const isWord = c => /[A-Za-z0-9_]/.test(c);
        return (!left || !isWord(left)) && (!right || !isWord(right));
    }

    function normalizeData(data, id, sourceFile) {
        data._id = id;
        data._sourceFile = sourceFile;
        data.basic = normStr(data.basic);
        data.constrain_task = normStr(data.constrain_task);
        data.attack = normStr(data.attack);
        data.defender = normStr(data.defender);
        data._basicKey = normKey(data.basic || data.constrain_task);
        data._attackKey = normKey(data.attack);
        data._defenderKey = normKey(data.defender);
        return data;
    }
    function normStr(x) { return (x ?? '').toString().trim(); }
    function normKey(x) { return normStr(x).toLowerCase(); }

    function isPassed(result) {
        if (result === undefined || result === null) return false;
        return (typeof result === 'string' && result.includes('Passed')) || result === true || result === 'true' || (typeof result === 'string' && result.toLowerCase() === 'passed');
    }

    function getStatusBadge(result) {
        const passed = isPassed(result);
        return `<span class="status-badge ${passed ? 'status-passed' : 'status-failed'}"><i class="fas ${passed ? 'fa-check' : 'fa-times'}"></i> ${passed ? '通过' : '失败'}</span>`;
    }

    function renderDashboard() {
        const total = filteredData.length;
        const passed = filteredData.filter(d => isPassed(d.PK_res ?? d.result_exec)).length;
        const failed = total - passed;
        const successRate = total > 0 ? ((passed / total) * 100).toFixed(1) : 0;
        const attackModels = [...new Set(filteredData.map(d => d.attack).filter(Boolean))];
        const defenseModels = [...new Set(filteredData.map(d => d.defender).filter(Boolean))];
        document.getElementById('dashboard').innerHTML = `
            <div class="stat-card success"><div class="stat-icon success"><i class="fas fa-check-circle"></i></div><div class="stat-value">${passed}</div><div class="stat-label">通过测试</div><div class="stat-change positive-change">成功率 ${successRate}%</div></div>
            <div class="stat-card danger"><div class="stat-icon danger"><i class="fas fa-times-circle"></i></div><div class="stat-value">${failed}</div><div class="stat-label">失败测试</div><div class="stat-change negative-change">失败率 ${(100 - successRate).toFixed(1)}%</div></div>
            <div class="stat-card primary"><div class="stat-icon primary"><i class="fas fa-robot"></i></div><div class="stat-value">${attackModels.length}</div><div class="stat-label">攻击模型</div><div class="stat-change">${attackModels.slice(0,3).join(', ')}${attackModels.length>3?'...':''}</div></div>
            <div class="stat-card warning"><div class="stat-icon warning"><i class="fas fa-shield-alt"></i></div><div class="stat-value">${defenseModels.length}</div><div class="stat-label">防御模型</div><div class="stat-change">${defenseModels.slice(0,3).join(', ')}${defenseModels.length>3?'...':''}</div></div>
        `;
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        filteredData.forEach((d, idx) => {
            const row = tbody.insertRow();
            row.innerHTML = `<td>${d._id}</td><td>${d.basic || d.constrain_task || '-'}</td><td><strong>${d.attack || '-'}</strong></td><td>${d.defender || '-'}</td><td>${d.epoch || '-'}</td><td>${getStatusBadge(d.PK_res || d.result_exec)}</td><td>${d.result_exec || '-'}</td>`;
            row.addEventListener('click', () => showDetail(idx));
        });
        document.getElementById('recordCount').textContent = `${filteredData.length} 条记录`;
        updateFooterStats();
    }

    function showDetail(index) {
        if (!filteredData.length || index<0 || index>=filteredData.length) return;
        selectedIndex = index;
        const data = filteredData[index];
        document.querySelectorAll('#tableBody tr').forEach((tr,i)=>tr.classList.toggle('selected', i===index));
        updateNavButtons();
        const detailDiv = document.getElementById('detailContent');
        detailDiv.innerHTML = `
            <div class="detail-card"><div class="detail-label"><i class="fas fa-file-alt"></i> 来源文件</div><div class="detail-value">${data._sourceFile || '-'}</div></div>
            <div class="detail-card"><div class="detail-label"><i class="fas fa-puzzle-piece"></i> epoch</div><div class="detail-value">${data.epoch || '-'}</div></div>
            <div class="detail-card"><div class="detail-label"><i class="fas fa-puzzle-piece"></i> Seed Problem</div><div class="detail-value">${data.basic || '-'}</div></div>
            <div class="detail-card"><div class="detail-label"><i class="fas fa-cogs"></i> 约束问题</div><div class="detail-value">${data.constrain_task || '-'}</div></div>
            <div class="detail-card"><div class="detail-label"><i class="fas fa-robot"></i> 攻击模型</div><div class="detail-value">${data.attack || '-'}</div></div>
            <div class="detail-card"><div class="detail-label"><i class="fas fa-shield-alt"></i> 防御模型</div><div class="detail-value">${data.defender || '-'}</div></div>
            <div class="detail-card"><div class="detail-label"><i class="fas fa-check-circle"></i> PK 结果</div><div class="detail-value">${getStatusBadge(data.PK_res || data.result_exec)}</div></div>
            <div class="detail-card"><div class="detail-label"><i class="fas fa-play-circle"></i> 执行结果</div><div class="detail-value">${formatValue(data.result_exec)}</div></div>
            <div class="detail-card"><div class="detail-label"><i class="fas fa-code"></i> 函数签名</div><div class="detail-value"><code>${data.sgn || '-'}</code></div></div>
            <div class="detail-card"><div class="detail-label"><i class="fas fa-keyboard"></i> 测试用例输入</div><div class="detail-value">${formatValue(data.test_input)}</div></div>
            <div class="detail-card"><div class="detail-label"><i class="fas fa-chart-bar"></i> 种子预期输出</div><div class="detail-value">${formatValue(data.resultH)}</div></div>
            <div class="detail-card"><div class="detail-label"><i class="fas fa-chart-bar"></i> 变异预期输出</div><div class="detail-value">${formatValue(data.result)}</div></div>
            <div class="detail-card full-width"><div class="detail-label"><i class="fas fa-code"></i> 变异代码</div><pre class="code-block">${escapeHtml(data.code || '暂无代码')}</pre></div>
            <div class="detail-card full-width"><div class="detail-label"><i class="fas fa-comment-alt"></i> 提示信息</div><pre class="code-block">${escapeHtml(data.prompt_commented || data.prompt || '暂无提示信息')}</pre></div>
            <div class="detail-card full-width"><div class="detail-label"><i class="fas fa-terminal"></i> 完成内容</div><pre class="code-block">${escapeHtml(data.completion || '暂无完成内容')}</pre></div>
        `;
        document.getElementById('detailPanel').classList.add('active');
    }

    function showPreviousDetail() { if(selectedIndex>0) showDetail(selectedIndex-1); else if(filteredData.length) showDetail(filteredData.length-1); }
    function showNextDetail() { if(selectedIndex<filteredData.length-1) showDetail(selectedIndex+1); else if(filteredData.length) showDetail(0); }
    function closeDetailPanel() { document.getElementById('detailPanel').classList.remove('active'); document.querySelectorAll('#tableBody tr').forEach(tr=>tr.classList.remove('selected')); selectedIndex=-1; }
    function updateNavButtons() {
        const prev=document.getElementById('prevBtn'), next=document.getElementById('nextBtn');
        prev.disabled = filteredData.length===0 || selectedIndex<=0; next.disabled = filteredData.length===0 || selectedIndex>=filteredData.length-1;
        prev.style.opacity = prev.disabled?'0.5':'1'; next.style.opacity = next.disabled?'0.5':'1';
    }
    function handleKeyboardNavigation(e) {
        if(!filteredData.length) return;
        if(e.key==='ArrowUp') { e.preventDefault(); if(selectedIndex>0) showDetail(selectedIndex-1); }
        else if(e.key==='ArrowDown') { e.preventDefault(); if(selectedIndex<filteredData.length-1) showDetail(selectedIndex+1); }
        else if(e.key==='Escape') closeDetailPanel();
    }

    function applyFilters() {
        const seed = document.getElementById('seedFilter').value;
        const attack = document.getElementById('attackFilter').value;
        const defender = document.getElementById('defenderFilter').value;
        const result = document.getElementById('resultFilter').value;
        filteredData = currentData.filter(d => {
            if(seed && d._basicKey !== normKey(seed)) return false;
            if(attack && d._attackKey !== normKey(attack)) return false;
            if(defender && d._defenderKey !== normKey(defender)) return false;
            if(result) { const passed = isPassed(d.PK_res ?? d.result_exec); if((result==='passed' && !passed) || (result==='failed' && passed)) return false; }
            return true;
        });
        renderDashboard(); renderTable(); renderCharts();
        if(filteredData.length) showDetail(0); else closeDetailPanel();
    }

    function updateFilters() {
        const seeds = [...new Set(currentData.map(d=>d.basic).filter(Boolean))];
        const attacks = [...new Set(currentData.map(d=>d.attack).filter(Boolean))];
        const defenders = [...new Set(currentData.map(d=>d.defender).filter(Boolean))];
        const seedSel = document.getElementById('seedFilter');
        seedSel.innerHTML = '<option value="">全部</option>';
        seeds.forEach(s=>{ const opt=document.createElement('option'); opt.value=s; opt.textContent=s; seedSel.appendChild(opt); });
        const attSel = document.getElementById('attackFilter');
        attSel.innerHTML = '<option value="">全部</option>';
        attacks.forEach(a=>{ const opt=document.createElement('option'); opt.value=a; opt.textContent=a; attSel.appendChild(opt); });
        const defSel = document.getElementById('defenderFilter');
        defSel.innerHTML = '<option value="">全部</option>';
        defenders.forEach(d=>{ const opt=document.createElement('option'); opt.value=d; opt.textContent=d; defSel.appendChild(opt); });
    }

    let charts = {};
    function renderCharts() { renderSuccessRateChart(); renderSeedDistributionChart(); }
    function renderSuccessRateChart() {
        const ctx = document.getElementById('successRateChart').getContext('2d');
        const models = [...new Set(filteredData.map(d=>d.defender).filter(Boolean))];
        const data = models.map(m=>{
            const items = filteredData.filter(d=>d.defender===m);
            const passed = items.filter(d=>isPassed(d.PK_res??d.result_exec)).length;
            const total = items.length;
            return { model:m, successRate:total? (passed/total)*100:0, passed, total };
        });
        if(charts.successRate) charts.successRate.destroy();
        charts.successRate = new Chart(ctx, {
            type:'bar', data:{ labels:data.map(d=>d.model), datasets:[{ label:'成功率 (%)', data:data.map(d=>d.successRate), backgroundColor:'rgba(110,142,251,0.8)', borderColor:'rgba(110,142,251,1)', borderWidth:1 }] },
            options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{ beginAtZero:true, max:100, title:{ display:true, text:'成功率 (%)' } } }, plugins:{ tooltip:{ callbacks:{ afterLabel:(ctx)=>`通过: ${data[ctx.dataIndex].passed} / ${data[ctx.dataIndex].total}` } } } }
        });
    }
    function renderSeedDistributionChart() {
        const ctx = document.getElementById('seedDistributionChart').getContext('2d');
        const counts = {};
        filteredData.forEach(d=>{ const seed = d.basic || d.constrain_task; if(seed) counts[seed] = (counts[seed]||0)+1; });
        if(charts.seedDistribution) charts.seedDistribution.destroy();
        charts.seedDistribution = new Chart(ctx, { type:'pie', data:{ labels:Object.keys(counts), datasets:[{ data:Object.values(counts), backgroundColor:['rgba(110,142,251,0.8)','rgba(66,230,149,0.8)','rgba(255,117,140,0.8)','rgba(255,209,102,0.8)','rgba(79,172,254,0.8)','rgba(122,103,238,0.8)'] }] }, options:{ responsive:true, maintainAspectRatio:false } });
    }
    function updateChartType(chartId, type) {
        if(chartId==='successRate'){
            const ctx = document.getElementById('successRateChart').getContext('2d');
            const models = [...new Set(filteredData.map(d=>d.defender).filter(Boolean))];
            const data = models.map(m=>{ const items=filteredData.filter(d=>d.defender===m); const passed=items.filter(d=>isPassed(d.PK_res??d.result_exec)).length; const total=items.length; return { model:m, successRate:total? (passed/total)*100:0 }; });
            if(charts.successRate) charts.successRate.destroy();
            charts.successRate = new Chart(ctx, { type:type, data:{ labels:data.map(d=>d.model), datasets:[{ label:'成功率 (%)', data:data.map(d=>d.successRate), backgroundColor:type==='pie'?['rgba(110,142,251,0.8)','rgba(66,230,149,0.8)','rgba(255,117,140,0.8)','rgba(255,209,102,0.8)']:'rgba(110,142,251,0.8)', borderColor:'rgba(110,142,251,1)', borderWidth:1 }] }, options:{ responsive:true, maintainAspectRatio:false } });
        } else if(chartId==='seedDistribution') {
            const ctx = document.getElementById('seedDistributionChart').getContext('2d');
            const counts={}; filteredData.forEach(d=>{ const seed=d.basic||d.constrain_task; if(seed) counts[seed]=(counts[seed]||0)+1; });
            if(charts.seedDistribution) charts.seedDistribution.destroy();
            charts.seedDistribution = new Chart(ctx, { type:type, data:{ labels:Object.keys(counts), datasets:[{ data:Object.values(counts), backgroundColor:['rgba(110,142,251,0.8)','rgba(66,230,149,0.8)','rgba(255,117,140,0.8)','rgba(255,209,102,0.8)'] }] }, options:{ responsive:true, maintainAspectRatio:false } });
        }
    }

    function formatValue(value) {
        if(value===undefined || value===null) return '未设置';
        if(Array.isArray(value)) return value.map(v=> (typeof v==='object' && v!==null) ? JSON.stringify(v,null,2) : String(v)).map(item=>`<div style="white-space:pre-wrap;margin-bottom:10px;">${escapeHtml(item)}</div>`).join('');
        if(typeof value==='object') return `<pre style="margin:0;white-space:pre-wrap;word-break:break-all;">${escapeHtml(JSON.stringify(value,null,2))}</pre>`;
        let str = String(value);
        if(str.includes('], [') || str.includes('}, {')) return str.split(/([\]}])\s*,\s*(?=[\[{])/g).map(part=>`<div style="white-space:pre-wrap;">${escapeHtml(part)}</div>`).join('<br>');
        return `<div style="white-space:pre-wrap;display:inline-block;">${escapeHtml(str)}</div>`;
    }
    function escapeHtml(text) { if(!text) return ''; const div=document.createElement('div'); div.textContent=text; return div.innerHTML; }
    function updateFileInfo() {
        document.getElementById('fileName').innerHTML = currentFiles.length ? `已加载 ${currentFiles.length} 个文件` : '未加载文件';
        document.getElementById('fileSize').innerHTML = currentFiles.length ? `共 ${currentData.length} 条记录` : '请选择 JSONL 文件';
    }
    function updateFooterStats() {
        const total=filteredData.length, passed=filteredData.filter(d=>isPassed(d.PK_res??d.result_exec)).length, rate=total? ((passed/total)*100).toFixed(1):0;
        document.getElementById('footerStats').innerHTML = `显示 ${total} 条记录 | 通过: ${passed} | 失败: ${total-passed} | 成功率: ${rate}%`;
    }
    function showLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }
    function showError(msg) { const e=document.getElementById('error'); document.getElementById('errorMessage').innerText=msg; e.style.display='flex'; setTimeout(()=>e.style.display='none',5000); }
    function hideError() { document.getElementById('error').style.display='none'; }
    function showEmptyState() { document.getElementById('emptyState').style.display='block'; }
    function hideEmptyState() { document.getElementById('emptyState').style.display='none'; }
    function showTable() { document.getElementById('tableContainer').style.display='block'; }
    function hideTable() { document.getElementById('tableContainer').style.display='none'; }
</script>
</body>
</html>
